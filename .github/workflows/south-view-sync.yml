
name: Sync approved South-View entries

on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: south-view-pages
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Sync approved entries (add, edit, and hide)
        env:
          SOUTHVIEW_CSV_URL: ${{ vars.SOUTHVIEW_PUBLIC_CSV_URL }}
        run: |
          python3 - <<'PY'
          import csv
          import io
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path
          from urllib.request import Request, urlopen

          url = os.environ.get('SOUTHVIEW_CSV_URL', '').strip()
          if not url.startswith('https://'):
              sys.exit('Missing SOUTHVIEW_PUBLIC_CSV_URL GitHub variable.')

          with urlopen(Request(url, headers={'User-Agent': 'SouthViewSync/2.0'}), timeout=30) as response:
              csv_text = response.read().decode('utf-8-sig')

          reader = csv.DictReader(io.StringIO(csv_text))
          required = {'id', 'year', 'date', 'period', 'person', 'title',
                      'description', 'whyItBelongs', 'media', 'sources',
                      'focus', 'status', 'approved'}
          if not reader.fieldnames or not required.issubset(reader.fieldnames):
              sys.exit('Public Export is missing required columns; nothing changed.')

          path = Path('content/timeline.js')
          original = path.read_text(encoding='utf-8')
          load_js = ("global.window = {}; require('./content/timeline.js'); "
                     "process.stdout.write(JSON.stringify(window.SOUTHVIEW_CONTENT.entries));")
          existing = json.loads(subprocess.check_output(['node', '-e', load_js], text=True))
          old_by_id = {entry['id']: entry for entry in existing}
          if len(old_by_id) != len(existing):
              sys.exit('Duplicate IDs in timeline.js; nothing changed.')

          incoming = []
          seen = set()

          for row in reader:
              entry_id = (row.get('id') or '').strip()
              if not entry_id:
                  continue

              if (row.get('approved') or '').strip().lower() not in {'true', 'yes', '1'}:
                  sys.exit(f'Unapproved record {entry_id} appeared in Public Export.')

              if not re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*', entry_id) or entry_id in seen:
                  sys.exit(f'Invalid or duplicate ID: {entry_id}')
              seen.add(entry_id)

              try:
                  year = int(row['year'])
                  media = json.loads(row['media'] or '{}')
                  sources = json.loads(row['sources'] or '[]')
              except (ValueError, TypeError) as exc:
                  sys.exit(f'Invalid year, media or sources for {entry_id}: {exc}')

              if not 1800 <= year <= 2100:
                  sys.exit(f'Invalid year for {entry_id}: {year}')

              if not all((row.get(k) or '').strip() for k in ('title', 'description', 'whyItBelongs')):
                  sys.exit(f'Missing required text for {entry_id}')

              if not isinstance(media, dict) or not isinstance(sources, list) or not sources:
                  sys.exit(f'Missing media object or sources for {entry_id}')

              if any(not isinstance(s, dict) or not s.get('label') or
                     not str(s.get('url', '')).startswith(('https://', 'http://')) for s in sources):
                  sys.exit(f'Invalid citation for {entry_id}')

              valid_periods = {'', 'prologue', 'founding', 'civil-rights', 'legacy'}
              valid_statuses = {'researched', 'draft', 'placeholder'}
              valid_focus = {'', 'railroad', 'capitol', 'kimball-house', 'auc',
                             'grady', 'sweet-auburn', 'ebenezer', 'fulton-county-stadium',
                             'turner-field', 'georgia-dome', 'downtown', 'midtown',
                             'skyline', 'south-view'}

              if ((row.get('period') or '').strip() not in valid_periods or
                  (row.get('status') or 'draft').strip() not in valid_statuses or
                  (row.get('focus') or '').strip() not in valid_focus):
                  sys.exit(f'Invalid period, focus, or status for {entry_id}')

              image = str(media.get('src') or '')
              if image and (not image.startswith(('https://', 'assets/images/')) or '..' in image):
                  sys.exit(f'Invalid image path for {entry_id}')

              entry = old_by_id.get(entry_id, {}).copy()
              entry.update({
                  'id': entry_id,
                  'year': year,
                  'date': (row.get('date') or '').strip(),
                  'person': (row.get('person') or '').strip(),
                  'title': row['title'].strip(),
                  'description': row['description'].strip(),
                  'whyItBelongs': row['whyItBelongs'].strip(),
                  'media': media,
                  'sources': sources,
                  'status': (row.get('status') or 'draft').strip(),
              })

              for optional in ('period', 'focus', 'lifespan'):
                  value = (row.get(optional) or '').strip()
                  if value:
                      entry[optional] = value
                  else:
                      entry.pop(optional, None)

              incoming.append(entry)

          # Protect the website against an accidentally empty export.
          if len(incoming) < 25:
              sys.exit(f'Only {len(incoming)} approved entries found; refusing to publish.')

          removed = set(old_by_id) - seen
          if len(removed) > 3:
              sys.exit(f'{len(removed)} removals detected; refusing to publish more than 3 at once.')

          # Preserve existing story order when years are equal.
          old_order = {entry['id']: i for i, entry in enumerate(existing)}
          new_order = {entry['id']: i for i, entry in enumerate(incoming)}
          incoming.sort(key=lambda e: (e['year'], old_order.get(e['id'], 100000 + new_order[e['id']])))

          if incoming == existing:
              print('No content changes; timeline.js unchanged.')
          else:
              start = original.find('  entries: [')
              end_marker = '\n  ],\n};'
              end = original.rfind(end_marker)

              if start < 0 or end < start or original.count('  entries: [') != 1:
                  sys.exit('Unexpected timeline.js format; nothing changed.')

              rendered = '  entries: ' + json.dumps(incoming, ensure_ascii=False, indent=2).replace('\n', '\n  ') + ','
              updated = original[:start] + rendered + original[end + len('\n  ],'):]

              path.write_text(updated, encoding='utf-8')
              print(f'Approved: {len(incoming)}; hidden/removed: {len(removed)}; saved timeline.js')
          PY

      - name: Check updated JavaScript syntax
        run: node --check content/timeline.js

      - name: Commit changes to timeline.js
        run: |
          if git diff --quiet -- content/timeline.js; then
            echo 'No changes to commit.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add content/timeline.js
            git commit -m 'Sync approved South-View historical entries'
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy website with updated timeline
        id: publish
        uses: actions/deploy-pages@v4
